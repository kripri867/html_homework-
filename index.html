<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sosisochka</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Перша секція -->
  <div class="section">
    <div class="section__container">
      <div class="card card--left">Left Content</div>
      <div class="card card--right">Right Content</div>
    </div>
  </div>


  <!-- Друга секція -->
  <div class="section section--main-first">
    <div class="section__container">
      <div class="group group--left"> 
        <div class="card">Left Content</div>
      </div>

      <div class="group group--right">
        <div class="card">Right Content</div>
        <div class="card">Right Content</div>
        <div class="card">Right Content</div>
      </div>
    </div>
  </div>


  <!-- Третя секція -->
  <div class="section section--main-second"> 
    <div class="section__container">
      <div class="group group--left">
        <div class="card">Left Content</div>
        <div class="card">Left Content</div>
      </div>
      <div class="group group--right">
        <div class="card">Right Content</div>
        <div class="card">Right Content</div>
      </div>
    </div>
  </div>
  <!-- 4 секція -->
<div class="section section--container__fourth">
  <div class="group card">
    <div>Big one</div>
  </div>
  <div >
    <div class="card">small one</div>
    <div class="card">small one</div>
  </div>
</div>
  <!-- 5 секція -->
<div class="section section--container__third">
  <div class="group card">
    <div>Big one</div>
  </div>
  <div>
    <div class="card">small one</div>
    <div class="card">small one</div>
  </div>
</div>

</body>



  


</html>
