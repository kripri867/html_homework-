<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <title>таблиця</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <table>
      <colgroup>
        <col style="width: 10%" />
        <col style="width: 9%" />
        <col style="width: 9%" />
        <col style="width: 18%" />
        <col style="width: 10%" />
        <col style="width: 10%" />
        <col style="width: 4%" />
      </colgroup>

      <tr style="height: 11%">
        <td class="white" colspan="2"></td>
        <td class="white" colspan="2"></td>
        <td class="yellow" colspan="2"></td>
        <td class="white" colspan="1" rowspan="4"></td>
      </tr>
      <tr style="height: 25%">
        <td class="white"></td>
        <td class="red" colspan="3" rowspan="2"></td>
        <td class="yellow" colspan="2"></td>
      </tr>
      <tr style="height: 25%">
        <td class="white" rowspan="2"></td>
        <td class="white"></td>
        <td class="white"></td>
      </tr>
      <tr style="height: 12%">
        <td class="black" rowspan="2" colspan="2"></td>
        <td class="white" colspan="1"></td>
        <td class="white" colspan="2"></td>
      </tr>
      <tr style="height: 14%">
        <td class="yellow" rowspan="3"></td>
        <td class="white"></td>
        <td class="blue" colspan="2" rowspan="2"></td>
        <td class="red" colspan="1" rowspan="3"></td>
      </tr>
      <tr style="height: 7%">
        <td class="white" rowspan="2" colspan="2"></td>
        <td class="black"></td>
      </tr>
      <tr style="height: 6%">
        <td class="white" colspan="3"></td>
      </tr>
    </table>
  </body>
</html>
